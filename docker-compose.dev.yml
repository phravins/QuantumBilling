services:
  db:
    image: postgres:16-alpine
    container_name: quantum_billing_dev_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-quantum_billing}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-quantum_billing_dev}
      POSTGRES_DB: ${DB_NAME:-quantum_billing_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_dev_data:
