name: C4GT Community Ticket
description: Create a ticket for the C4GT Community Program (Code for GoodTech)
title: "[C4GT Community]: "
labels: ["C4GT Community", "C4GT Coding"]
body:
  - type: textarea
    id: ticket-description
    validations:
      required: true
    attributes:
      label: Ticket Contents
      value: |
        ## Description
        QuantumBilling is a free, open-source GST billing app for Indian small, micro and medium businesses, built with Elixir, Phoenix LiveView and PostgreSQL.

        [Describe the need for this feature, the measurable goal, and who benefits (e.g. MSME owners, accountants). Mention expected scale/impact where possible.]

  - type: textarea
    id: ticket-goals
    validations:
      required: true
    attributes:
      label: Goals
      description: List the goals of the feature.
      value: |
        ## Goals
        - [ ] [Goal 1]
        - [ ] [Goal 2]
        - [ ] [Goal 3]

        Setup guide: https://github.com/phravins/QuantumBilling#readme

  - type: textarea
    id: ticket-expected-outcome
    validations:
      required: true
    attributes:
      label: Expected Outcome
      description: Describe in detail what the final result should look like and how it should behave.

  - type: textarea
    id: ticket-acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: List the acceptance criteria for this feature (tests passing, mix format clean, etc.).

  - type: textarea
    id: ticket-implementation-details
    validations:
      required: true
    attributes:
      label: Implementation Details
      description: Technical details of the proposed implementation — modules/files involved, Elixir/Phoenix specifics, database changes.

  - type: textarea
    id: ticket-mockups
    attributes:
      label: Mockups/Wireframes
      description: Links to any mockups, wireframes or diagrams (optional).

  - type: input
    id: ticket-product
    attributes:
      label: Product Name
      value: QuantumBilling
    validations:
      required: true

  - type: dropdown
    id: ticket-organisation
    attributes:
      label: Organisation Name
      multiple: false
      options:
        - OSWORKS Open Source Community
    validations:
      required: true

  - type: input
    id: ticket-governance-domain
    attributes:
      label: Domain
      value: MSME finance / GST compliance

  - type: dropdown
    id: ticket-technical-skills-required
    attributes:
      label: Tech Skills Needed
      description: Select the technologies needed for this ticket
      multiple: true
      options:
        - Elixir
        - Phoenix
        - Phoenix LiveView
        - PostgreSQL
        - Oban
        - CI/CD
        - Database
        - Debugging
        - Docker
        - HTML
        - JavaScript
        - Markdown
        - Performance Improvement
        - Security
        - SQL
        - Tailwind CSS
        - Test
        - UI/UX/Design
        - Other
    validations:
      required: true

  - type: textarea
    id: ticketorg-mentors
    attributes:
      label: Organizational Mentor
      description: Tag the mentor(s) for this ticket
      value: "@phravins"
    validations:
      required: true

  - type: textarea
    id: ticketangel-mentors
    attributes:
      label: Angel Mentor
      description: Tag any volunteer mentor (optional)
    validations:
      required: false

  - type: dropdown
    id: ticket-complexity
    attributes:
      label: Complexity
      multiple: false
      options:
        - Low
        - Medium
        - High
    validations:
      required: true

  - type: dropdown
    id: ticket-category
    attributes:
      label: Category
      description: Choose the categories that best describe your ticket
      multiple: true
      options:
        - API
        - Analytics
        - Accessibility
        - Backend
        - Beginner Friendly
        - Configuration
        - CI/CD
        - Database
        - Documentation
        - Deployment
        - Frontend
        - Internationalization
        - Localization
        - Maintenance
        - Performance Improvement
        - Refactoring
        - Research
        - Security
        - Testing
        - Other
    validations:
      required: true
