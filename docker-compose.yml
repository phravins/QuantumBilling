version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER:-elixir_vibe}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-Vibe@26}
      POSTGRES_DB: ${DATABASE_NAME:-quantum_billing_prod}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      MIX_ENV: prod
      PHX_SERVER: "true"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-bK8yHn0/GZ79lPqS2w1vX6mU4tR9oD3e8a7bC5dE1fG3hI5jK7lM9nO1pQ3rS5tU}
      DATABASE_URL: eotpsql://${DATABASE_USER:-elixir_vibe}:${DATABASE_PASSWORD:-Vibe@26}@db:5432/${DATABASE_NAME:-quantum_billing_prod}
      PORT: "4000"

volumes:
  postgres_data:
